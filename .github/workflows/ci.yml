name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Database tests (capacity, races, row level security)
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/wb_test

      - name: Build (test server)
        run: npm run build:test

      - name: Every built page keeps the house rules
        run: npm run test:content

      - name: Install the browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests at phone width
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/wb_e2e

      - name: Lighthouse, phone settings, 95+ in all four categories
        run: |
          FORCE_INDEXABLE=1 npm run build:node
          npx lhci autorun
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/wb_e2e
          APP_ENV: test

      - name: What Lighthouse measured
        if: always()
        run: node scripts/lighthouse-summary.mjs

      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          # .lighthouseci starts with a dot, so it's left out unless hidden files are included.
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
