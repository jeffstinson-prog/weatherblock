name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Build (test server)
        run: npm run build:node

      - name: Install the browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests at phone width
        run: npm run test:e2e

      - name: Lighthouse, phone settings, 95+ in all four categories
        run: |
          FORCE_INDEXABLE=1 npm run build:node
          npx lhci autorun

      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
