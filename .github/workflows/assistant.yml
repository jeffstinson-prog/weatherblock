name: Assistant (live)

# The assistant's rule tests against the real model. They cost a little each
# run, so they run only when something the assistant reads or says changes,
# and only once the ANTHROPIC_API_KEY secret is set in the repository.
on:
  pull_request:
    paths:
      - 'facts.yaml'
      - 'src/content/help/**'
      - 'src/server/assistant/**'
      - 'tests/assistant-live/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Top 30 questions and rule attacks
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run test:assistant
      - name: No key yet
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "Set the ANTHROPIC_API_KEY repository secret to run the live assistant tests."
