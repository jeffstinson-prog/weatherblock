# WeatherBlock Roofing: the facts file.
#
# The website and the assistant say only what is written here.
# Leave a value empty ("") and everything that depends on it stays hidden:
# the sentence, the badge, the help answer, and the assistant's knowledge of it.
#
# Text values can use {{business.name}} and other {{paths}} from this file.
# Change a value in a pull request. The site updates when it merges.

business:
  name: WeatherBlock Roofing # the one place the business name lives
  legalName: WeatherBlock Roofing Incorporated # NC business corporation, SOSID 2997840, formed 2025-03-02
  owners:
    - name: Justin Coffey
      role: runs the crews # finishes the sentence "Justin ..."
    - name: JT Stinson
      role: ""
  # Town only. The principal office on file with the state is a home address,
  # so the street stays off the site.
  city: Ocean Isle Beach
  state: NC
  zip: "28469"
  # Printed at the bottom of follow-up and review emails, as the CAN-SPAM Act
  # requires. A P.O. box works. Blank: those emails wait, and the owner app says so.
  mailingAddress: ""
  lines:
    - Local roots. Lasting protection.
    - Coastal roofing. Local commitment.
  verse:
    text: Shelter from the storm and rain.
    ref: Isaiah 4:6

contact:
  phone: (910) 444-1849
  phoneE164: "+19104441849"
  takesTexts: true # the site offers Text on this number: texts to it must reach you
  email: info@weatherblockroofingnc.com
  hours: "" # phone hours to publish, e.g. "Mon to Sat, 7 am to 7 pm". Google currently says "Open 24 hours".

web:
  domain: weatherblockroofingnc.com
  launched: false # false keeps search engines out (noindex) until launch day

serviceArea:
  summary: Ocean Isle Beach and the rest of Brunswick County, North Carolina
  short: Ocean Isle Beach and Brunswick County
  state: NC
  counties:
    - Brunswick

services:
  - key: replacement
    name: Roof replacement
    path: /services/roof-replacement/
  - key: repair
    name: Roof repairs
    path: /services/roof-repairs/
  - key: storm
    name: Storm damage
    path: /services/storm-damage/
  - key: drone
    name: Drone inspections
    path: /services/drone-inspections/

inspection:
  free: true
  # From Justin's site: "We inspect your roof by drone, keeping foot traffic off
  # your shingles until repairs or replacement are needed."
  byDrone: true
  windowHours: 2
  # You get photos and a written estimate (from the insurance claims fact below).
  deliverables: photos and a written estimate
  homeNotRequired: true # CONFIRM: nobody has to be home for a drone inspection
  duration: "" # how long the visit takes, e.g. "about 30 minutes". Blank: hidden.

credentials:
  # The state's record of the company. Shown under "Check us yourself" on the about page.
  registration:
    id: "2997840" # NC Secretary of State ID (SOSID), from the state's record. Blank: not shown.
    lookupUrl: https://www.sosnc.gov/online_services/search/by_title/_Business_Registration
  license:
    holder: Justin Coffey
    kind: NC general contractor
    number: "" # Blank: the site makes no license claim anywhere.
    lookupUrl: "" # The licensing board's public search, once the number is in.
  insurance:
    liability: "" # e.g. "General liability, $1,000,000 per occurrence". Blank: no "insured" claim.
    workersComp: "" # "Yes" or "No". Blank: not mentioned.
  warranty:
    workmanship: "" # e.g. "5 years on our labor". Blank: no warranty claim.
  certifications: [] # e.g. ["GAF Certified Contractor"]. Empty: no certification claims.
  fortified:
    certified: false
    inProgress: true # working on FORTIFIED certification
  drone:
    part107: "" # name of the FAA Part 107 certificate holder. Blank: not mentioned.

reviews:
  google:
    rating: 5.0
    count: 11
    asOf: "2026-11-19"
    url: https://share.google/wepCy5SeWsGcWvBwv

# Any price the site or the assistant may state. Empty: the site states no prices.
prices: []

# The estimate page at /estimate/. Someone enters their address and how to reach them,
# and the request comes to the owners first, with the roof measured from above, so one
# of you can call. The site shows no price for a roof (JT and Justin, November 23, 2026).
estimate:
  on: true
  # What people are told about the call back. It finishes "One of us will call you ...",
  # for example "within one business hour". Blank: "soon". Only promise what you'll keep.
  callback: within one business hour
  # false: no price anywhere on the site. true: after someone sends their name and number,
  # the page shows them a rough price range, and the page is called "Instant estimate".
  showBallpark: false
  # The ballpark the owners see with each request. Only what customers pay; never our costs.
  material: architectural shingles
  pricePerSquare: 450 # installed, per square (100 square feet of roof)
  largeRoof:
    minSquares: 30
    pricePerSquare: [350, 400] # less per square on big roofs, depending on size
  # Google's measured roof area times this: from as measured to 15% more, for waste and what imagery can't see.
  measuredRange: [1.0, 1.15]
  # Without Google data: the outline's area times this, about 1.1 for a low slope, 1.3 for a steep one.
  slopeFactor: [1.1, 1.3]

# After the inspection: the estimate, follow-ups and the roof job.
pipeline:
  estimateTurnaround: "" # finishes "Your estimate will be ready ...", e.g. "within 2 business days". Blank: "soon".
  followUpDays: [2, 7, 21] # follow-up emails after an estimate goes out, until the customer answers
  reviewUrl: "" # the "ask for reviews" link from your Google Business Profile. Blank: the reviews link above.
  # What the customer's page says to do before a roof job's day. Short lines. Add one only if every crew does it.
  jobDayPrep:
    - Move cars out of the driveway the evening before.
    - Keep pets inside while we work.
  jobHours: "" # working hours on a job's day, e.g. "7 am to 5 pm". Blank: not mentioned.

financing:
  provider: Acorn Finance
  url: https://www.acornfinance.com/pre-qualify/?d=QP3YO
  disclosure: >-
    You'll continue to Acorn Finance, a third-party financing service. The lender
    sets approval, rates and terms. {{business.name}} does not guarantee approval.
  # From Acorn's own site (checked 2026-11-19). Keep in step with the provider above.
  notes:
    - "{{financing.provider}} is not a lender. It connects you with lenders, and the lenders make the credit decisions."
    - "Checking offers starts with a soft credit check, which {{financing.provider}} says does not affect your credit score. A lender may run a hard credit check if you move forward with an offer."

insuranceClaims:
  weDo: We document the damage with photos and a written estimate.
  youDo: You file the claim and settle it with your insurance company.

# Only real photos of our own jobs, each with the homeowner's OK.
# Example entry: { file: smith-roof-after.jpg, alt: "New shingle roof in Calabash", homeownerOk: "2026-12-01" }
photos: []

texts:
  maxPerBooking: 12 # the most texts one customer gets, from booking through the roof job. Shown on the booking form.
